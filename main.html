<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form action="signup" method="POST">
		<label for="name">Name</label>
		<input type="text" id="name"  required>
		
		<label for="email">Email</label>
		<input type="email" id="email" required>
		
		<label>Gender</label>
		<input type="radio" name="gender" id="gender_m" required>
		<label for="gender_m">Male</label>
		<input type="radio" name="gender" id="gender_f" required>
		<label for="gender_f">female</label>
		
		<label for="cars">Car Brands</label>
		<select id="cars" >
			<option value="">--please select option below--</option>
			<option value="bmw">BMW</option>
			<option value="adui">Audi</option>
			<option value="mercedez">Mercedez</option>
		</select>

		<label for="carage">Car Age</label>
		<input type="number" id="carage" required>

		<label for="dop">Date of purchase</label>
		<input type="date" id="dop"  required>

		<label for="password">password</label>
		<input type="password" id="password"  required>

		<button type="submit">Submit</button>
		
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
